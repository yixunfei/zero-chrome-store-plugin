name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --dir apps/extension typecheck
      - run: pnpm build:extension

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/authenticator
      - name: Analyze Flutter sources
        working-directory: apps/authenticator
        run: |
          fixture='integration_test/generated/qr_capture.dart'
          created_fixture=0
          if [ ! -f "$fixture" ]; then
            mkdir -p "$(dirname "$fixture")"
            printf '%s\n' \
              'const expectedRequestBytes = 0;' \
              'const browserQrImages = <String>[];' > "$fixture"
            created_fixture=1
          fi
          cleanup_fixture() {
            if [ "$created_fixture" -eq 1 ]; then
              rm -f "$fixture"
              rmdir "$(dirname "$fixture")" 2>/dev/null || true
            fi
          }
          trap cleanup_fixture EXIT
          flutter analyze
      - run: flutter test
        working-directory: apps/authenticator
      - run: flutter build apk --debug
        working-directory: apps/authenticator
